<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Planner</title>
    <script>
      // Runs before first paint, so a dark visitor never sees a white flash.
      // Duplicated in ThemeToggle, which owns the theme once React has mounted.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('planner-theme');
        } catch (error) {
          // Private browsing can refuse storage. The OS preference still works.
        }
        var dark = stored
          ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute(
          'data-bs-theme',
          dark ? 'dark' : 'light',
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
